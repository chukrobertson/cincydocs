[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cincydocs-forms"
version = "0.1.0"
description = "CincyDocs Forms Library - searchable public forms directory"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["forms_library*"]

[tool.setuptools.package-data]
forms_library = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/forms/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = [
    "B008",   # function calls in typer defaults are standard practice
    "B904",   # typer.Exit is clean exit, not an error chain
    "F401",   # fitz import check pattern, module-level re-exports
    "UP042",  # StrEnum preference, not critical
]

[tool.pytest.ini_options]
testpaths = ["tests"]
