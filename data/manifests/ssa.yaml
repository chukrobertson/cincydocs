      - retirement application

  - slug: ssa-form-ssa-16
    title: Application for Disability Insurance Benefits
    form_number: Form SSA-16-BK
    agency: Social Security Administration
    jurisdiction: United States
    category: Benefits
    description: Application for Social Security Disability Insurance (SSDI) benefits. Available in English and Spanish.
    plain_language_summary: If you cannot work because of a medical condition expected to last at least one year or result in death, you may use this form to apply for SSDI benefits. Most people apply online or by phone, but the paper form is available if needed.
    official_page_url: https://www.ssa.gov/forms/ssa-16.html
    official_download_url: https://www.ssa.gov/forms/ssa-16-bk.pdf
    redistribution_status: permitted
    publication_status: link_only
    review_level: elevated
    language: en
    tags:
      - SSDI
      - disability
      - disability application
      - SSA
      - unable to work
      - medical condition

  - slug: ssa-form-ssa-827
    title: Authorization to Disclose Information to the Social Security Administration
    form_number: Form SSA-827
    agency: Social Security Administration
    jurisdiction: United States
    category: Benefits
    description: Authorizes medical sources, schools, and other parties to disclose information to the SSA for claims processing.
    plain_language_summary: This form lets the SSA request your medical records and other personal information when you apply for benefits like Social Security Disability Insurance or Supplemental Security Income. By signing it, you give healthcare providers and other sources permission to share your information with the SSA. Includes instructions in English and Spanish.
    official_page_url: https://www.ssa.gov/forms/ssa-827.pdf
    official_download_url: https://www.ssa.gov/forms/ssa-827.pdf
    redistribution_status: permitted
    publication_status: link_only
    review_level: elevated
    language: en
    tags:
