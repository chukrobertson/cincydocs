  - slug: ssa-form-ss-5
    title: Application for a Social Security Card
    form_number: Form SS-5
    agency: Social Security Administration
    jurisdiction: United States
    category: Benefits
    description: Used to apply for an original Social Security card, request a replacement, or update information on your Social Security record. All forms are free.
    plain_language_summary: Use this form to get a new Social Security card, replace a lost card, or update your name on your Social Security record. You will need to provide documents proving your identity, age, and citizenship or immigration status. The Social Security Administration does not charge for a Social Security card. Available in English and Spanish.
