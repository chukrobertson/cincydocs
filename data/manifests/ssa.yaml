  - slug: ssa-form-ssa-1
    title: Application for Retirement Insurance Benefits
    form_number: Form SSA-1-BK
    agency: Social Security Administration
    jurisdiction: United States
    category: Benefits
    description: Application for Social Security retirement insurance benefits. Available in English and Spanish.
    plain_language_summary: This is the form used to apply for Social Security retirement benefits. The SSA also allows you to apply online through their website, but this paper form is available for those who need it or prefer it. You can apply up to four months before you want your benefits to start.
    official_page_url: https://www.ssa.gov/forms/ssa-1.html
    official_download_url: https://www.ssa.gov/forms/ssa-1-bk.pdf
