  - slug: irs-form-w9
    title: Request for Taxpayer Identification Number and Certification
    form_number: Form W-9
    agency: Internal Revenue Service
    jurisdiction: United States
    category: Taxes
    description: Used to provide a correct Taxpayer Identification Number (TIN) to the person who is required to file an information return with the IRS to report certain transactions.
    plain_language_summary: Use this form when a business or other requester needs your correct taxpayer identification number for information reporting — for example, when you are paid as an independent contractor. Employees generally complete Form W-4 instead. Return Form W-9 to the requester; do not send it directly to the IRS.
    official_page_url: https://www.irs.gov/forms-pubs/about-form-w-9
