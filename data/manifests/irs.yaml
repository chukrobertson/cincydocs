  - slug: irs-form-ss4
    title: Application for Employer Identification Number
    form_number: Form SS-4
    agency: Internal Revenue Service
    jurisdiction: United States
    category: Business
    description: Used to apply for an Employer Identification Number (EIN) from the IRS for a business entity.
    plain_language_summary: This form is used to get an EIN — a tax ID number for a business. You need an EIN if you are starting a business, hiring employees, opening a business bank account, or forming a partnership or corporation. You can also apply for an EIN online through the IRS website.
    official_page_url: https://www.irs.gov/forms-pubs/about-form-ss-4
    official_download_url: https://www.irs.gov/pub/irs-pdf/fss4.pdf
