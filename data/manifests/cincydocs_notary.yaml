    category: Notary
    description: Printable paper journal for recording traditional in-person notarial acts in Ohio.
    plain_language_summary: Use one entry for each signer and notarial act. The journal records the document description, act, identification method, signer journal signature, fees, safeguards, and notes while avoiding full identification numbers and sensitive document contents.
